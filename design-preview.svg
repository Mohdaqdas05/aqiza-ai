    <circle cx="1350" cy="34" r="15" fill="#171b19" stroke="#313733"/><circle cx="1350" cy="34" r="1.5" fill="#b6bdb8"/><circle cx="1350" cy="28" r="1.5" fill="#b6bdb8"/><circle cx="1350" cy="40" r="1.5" fill="#b6bdb8"/>
    <text x="375" y="136" class="ui" fill="#cdd2ce" font-size="12" font-weight="550">Aqdas</text><circle cx="361" cy="132" r="12" fill="#23312a"/><text x="361" y="136" text-anchor="middle" class="ui" fill="#d4e5db" font-size="10" font-weight="600">A</text>
    <rect x="346" y="153" width="734" height="77" rx="13" fill="#1b201d" stroke="#2c332e"/>
    <text fill="#eceeeb" x="368" y="183" class="ui primary" font-size="14">Why does refreshToken run twice after a tab wakes up?</text>
    <text fill="#979e99" x="368" y="205" class="ui muted" font-size="12.5">The focus handler and visibilitychange listener both trigger it.</text>
    <rect x="349" y="269" width="29" height="29" rx="8" fill="#26372e"/><path d="M357 283h13m-6.5-6.5v13" stroke="#65c69a" stroke-width="1.4" stroke-linecap="round"/>
    <text fill="#eceeeb" x="392" y="288" class="ui primary" font-size="13" font-weight="600">AqizaAI</text><circle cx="450" cy="284" r="3" fill="#56bb8d"/><text fill="#979e99" x="462" y="288" class="ui muted" font-size="11">qwen3.6:latest · local</text>
    <text x="349" y="329" class="ui" fill="#d9ddda" font-size="14">Both listeners can fire during the same wake-up. If each starts a refresh</text>
    <text x="349" y="352" class="ui" fill="#d9ddda" font-size="14">before either one updates the session state, the requests overlap.</text>
    <text x="349" y="389" class="ui" fill="#d9ddda" font-size="14">Keep one in-flight promise and let both callers await it:</text>
    <rect x="349" y="408" width="750" height="112" rx="10" fill="#171a18" stroke="#303733"/>
    <text x="370" y="436" class="mono" fill="#999f9a" font-size="11">1</text><text x="398" y="436" class="mono" fill="#dfe4e0" font-size="12">let refreshInFlight: Promise&lt;Session&gt; | null = null;</text>
    <text x="370" y="460" class="mono" fill="#999f9a" font-size="11">2</text><text x="398" y="460" class="mono" fill="#dfe4e0" font-size="12">if (!refreshInFlight) refreshInFlight = refreshSession();</text>
    <text x="370" y="484" class="mono" fill="#999f9a" font-size="11">3</text><text x="398" y="484" class="mono" fill="#dfe4e0" font-size="12">return refreshInFlight;</text>
    <text x="349" y="552" class="ui" fill="#d9ddda" font-size="14">Clear the reference in `finally` after the request settles, so a later wake-up</text>
    <text x="349" y="575" class="ui" fill="#d9ddda" font-size="14">can refresh again. I’d also check whether both listeners are still needed.</text>
    <text fill="#979e99" x="349" y="614" class="ui muted" font-size="11">Helpful?  <tspan fill="#c9ceca">↑</tspan>    <tspan fill="#c9ceca">↓</tspan>    ·    Copy    ·    Try again</text>
    <rect x="324" y="666" width="1018" height="125" rx="16" fill="#191d1b" stroke="#373d39"/><text fill="#979e99" x="348" y="700" class="ui muted" font-size="15">Message AqizaAI</text>
    <circle cx="353" cy="758" r="13" fill="#222724" stroke="#414843"/><path d="M353 751v14m-7-7h14" stroke="#a5aca6" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="387" y="739" width="203" height="37" rx="8" fill="#202522" stroke="#3a423d"/><circle cx="405" cy="757.5" r="4" fill="#55bc8e"/><text fill="#eceeeb" x="418" y="762" class="ui primary" font-size="11.5" font-weight="550">qwen3.6:latest</text><text fill="#979e99" x="523" y="762" class="ui muted" font-size="10.5">Ollama</text><path d="m573 754 4 4 4-4" fill="none" stroke="#979e99" stroke-width="1.4"/>
    <text fill="#737a75" x="1111" y="763" class="ui quiet" font-size="11">Enter to send</text><rect x="1293" y="737" width="35" height="35" rx="9" fill="#47ad83"/><path d="M1310 761v-14m0 0-5 5m5-5 5 5" stroke="#0e2119" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text fill="#737a75" x="835" y="816" text-anchor="middle" class="ui quiet" font-size="10.5">Local model · Private conversation</text>
